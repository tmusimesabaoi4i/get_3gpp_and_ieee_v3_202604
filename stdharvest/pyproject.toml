[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stdharvest"
version = "1.0.0"
description = "3GPP / IEEE standard document batch downloader and PDF/HTML converter"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "stdharvest maintainers" }]
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1.2",
    "requests>=2.31.0",
    "mammoth>=1.6.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
stdharvest = "stdharvest.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
