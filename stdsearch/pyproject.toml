[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stdsearch"
version = "1.1.0"
description = "Search tool for stdharvest-generated HTML (3GPP / IEEE standard docs)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "stdsearch maintainers" }]
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1.2",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.scripts]
stdsearch = "stdsearch.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
